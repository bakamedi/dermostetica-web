<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED596" />
      <stop offset="45%" stop-color="#C5A059" />
      <stop offset="75%" stop-color="#AF8943" />
      <stop offset="100%" stop-color="#8E6A2A" />
    </linearGradient>
    <radialGradient id="discGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="85%" stop-color="#FAF7F2" />
      <stop offset="100%" stop-color="#F2ECE1" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#8E6A2A" flood-opacity="0.25" />
    </filter>
  </defs>
  
  <!-- Outer Gold Rim -->
  <circle cx="32" cy="32" r="30.5" fill="url(#discGrad)" stroke="url(#goldGrad)" stroke-width="1.8" />
  
  <!-- Inner Ring -->
  <circle cx="32" cy="32" r="28" fill="none" stroke="url(#goldGrad)" stroke-width="0.5" stroke-opacity="0.4" />

  <!-- D Monogram in Gold -->
  <g filter="url(#shadow)" fill="url(#goldGrad)">
    <!-- Main D stem & bowl -->
    <path d="M22 17 h 9.5 c 8 0 13 4.2 13 12.5 c 0 8.2 -5 12.5 -13 12.5 h -9.5 z m 5 20.8 h 4 c 5.2 0 8.5 -2.7 8.5 -8.3 c 0 -5.5 -3.3 -8.3 -8.5 -8.3 h -4 z" />
    <!-- Artistic beauty curve loop intertwining inside -->
    <path d="M 31 29 C 33 26, 37 26, 37.5 29.5 C 38 33, 33 34, 30 37 C 34 38.5, 38 41, 34 43.5 C 30 45, 27 41, 30 38" fill="none" stroke="url(#goldGrad)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>